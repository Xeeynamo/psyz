name: Build samples

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

jobs:
  build-samples-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install build-essential cmake ninja-build libsdl2-dev libxtst-dev
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile samples (PC)
        run: |
          for cmake_file in samples/*/CMakeLists.txt; do
            sample_dir=$(dirname "$cmake_file")
            echo "Building $sample_dir"
            cmake -GNinja -DSDL_STATIC=ON -DCMAKE_MESSAGE_LOG_LEVEL=NOTICE -B "$sample_dir/build/" -S "$sample_dir/"
            cmake --build "$sample_dir/build/" -- --quiet
          done

  build-samples-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        compiler:
          - name: MSVC
            toolset: ''
          - name: ClangCl
            toolset: '-T ClangCl'
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build overlays sample (${{ matrix.compiler.name }})
        run: |
          cmake -S samples/overlays -B samples/overlays/build ${{ matrix.compiler.toolset }}
          cmake --build samples/overlays/build --config Debug
      - name: Run overlays sample (${{ matrix.compiler.name }})
        working-directory: samples/overlays/build/Debug
        run: ./host.exe
        env:
          SDL_VIDEODRIVER: offscreen
